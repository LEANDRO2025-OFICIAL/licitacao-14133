[project]
name = "licitacao-14133"
version = "0.1.0"
description = "CLI Python open-source que gera documentos do processo licitatorio conforme a Lei 14.133/2021 (Brasil) e analisa a jurisprudencia do Tribunal de Contas aplicavel ao orgao."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Leandro Santos", email = "leowizz70@gmail.com" }]

[project.scripts]
licitacao-14133 = "radar.cli:main"
radar = "radar.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]